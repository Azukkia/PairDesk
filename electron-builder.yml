# Packaging configuration (https://www.electron.build).
#   npm run dist:win    → dist/PairDesk-Setup-<version>.exe (NSIS installer)
#   npm run dist:linux  → AppImage + .deb
#   npm run dist:mac    → dist/PairDesk-<version>-mac.dmg + .zip (universal: Intel + Apple silicon, on a Mac)
appId: com.azukkia.pairdesk
productName: PairDesk
copyright: Copyright © 2026 Azukkia

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - assets/**/*
  - pairdesk.config.json
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{README,readme,CHANGELOG,changelog,HISTORY}*"
  - "!**/node_modules/**/{test,tests,__tests__,example,examples,docs,doc,benchmarks}/**"

# koffi ships prebuilt Node-API binaries: nothing to compile. Each platform
# has its own package (@koromix/koffi-<os>-<arch>); a universal Mac build
# needs both Mac ones (scripts/koffi-mac.mjs, run by npm run dist:mac).
npmRebuild: false
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

# Only keep the UI languages PairDesk uses.
electronLanguages:
  - en-US
  - fr

protocols:
  - name: PairDesk
    schemes:
      - pairdesk

# Auto-update feed: installed copies check the GitHub releases of this repo.
publish:
  - provider: github
    owner: Azukkia
    repo: PairDesk
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # The "PairDesk Camera" virtual webcam (npm run build:camera).
  extraResources:
    - from: native/bin/win32-x64
      to: camera
      filter:
        - PairDeskCamera.dll
    # The screen capture without cursor (npm run build:capture).
    - from: native/bin/win32-x64
      to: capture
      filter:
        - PairDeskCapture.dll
  artifactName: PairDesk-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.utilities
  icon: build/icon.icns
  # No Apple Developer ID certificate: an ad-hoc signature, which Apple silicon
  # requires to run anything, and no notarization (first launch: right-click →
  # Open). The hardened runtime would refuse koffi's library with an ad-hoc
  # signature (library validation), and only matters for notarization.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  # koffi's binaries are already one per architecture, identical in the x64
  # and arm64 builds: kept as they are in the universal app.
  x64ArchFiles: "**/node_modules/@koromix/koffi-darwin-*/**"
  extendInfo:
    # A regular app with a Dock icon (the menu bar icon comes in addition).
    LSUIElement: false
  artifactName: PairDesk-${version}-mac.${ext}

dmg:
  title: PairDesk ${version}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PairDesk
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  multiLanguageInstaller: true
  installerLanguages:
    - fr_FR
    - en_US
  language: "1036"
  displayLanguageSelector: false

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
  synopsis: Remote control and screen sharing, peer-to-peer
  description: PairDesk lets you view and control a remote computer with an ID and a password.
  maintainer: Azukkia <azukkia.marechal@gmail.com>
  artifactName: PairDesk-${version}-${arch}.${ext}

deb:
  depends:
    - libxtst6
    - libx11-6
    - libxfixes3
    - libnotify4
    - libnss3
    - libasound2 | libasound2t64
