name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install X11 test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6
      - name: End-to-end test (two app instances under Xvfb, PairDesk server)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
      - name: End-to-end test (default mode, MQTT relays)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
        env:
          PAIRDESK_E2E_TRANSPORT: mqtt
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-mqtt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-linux
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Tests + installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the "PairDesk Camera" webcam (DirectShow filter)
        run: npm run build:camera
      - name: Build the screen capture without cursor (Desktop Duplication)
        run: npm run build:capture
      - name: End-to-end test (real Windows desktop, SendInput)
        run: npm run test:e2e
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}\e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: ${{ runner.temp }}\e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the Windows installer
        run: npx electron-builder --win --x64 --publish never
      - name: End-to-end test of the packaged application
        run: npm run test:e2e
        env:
          PAIRDESK_PACKAGED_EXE: dist/win-unpacked/PairDesk.exe
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}\e2e-packaged
      - name: Install with the setup program, test the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PairDesk-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PairDesk'
          $exe = Join-Path $dir 'PairDesk.exe'
          if (-not (Test-Path $exe)) { throw "PairDesk.exe was not installed in $dir" }
          Get-ChildItem $dir | Format-Table Name, Length
          $env:PAIRDESK_PACKAGED_EXE = $exe
          $env:PAIRDESK_E2E_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'e2e-installed'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $camera = 'HKCU:\Software\Classes\CLSID\{DC55A64C-A76A-40C0-8494-4D5E79100E45}'
          if (-not (Test-Path $camera)) { throw 'the camera session did not register PairDesk Camera' }
          Start-Process -FilePath (Join-Path $dir 'Uninstall PairDesk.exe') -ArgumentList '/S' -Wait
          # The uninstaller finishes from a copy of itself: wait for it.
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $camera)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $camera) { throw 'PairDesk Camera is still registered after uninstalling' }
      - uses: actions/upload-artifact@v4
        with:
          name: PairDesk-Setup-windows
          path: |
            dist/PairDesk-Setup-*.exe
            dist/latest.yml
          retention-days: 90

  macos:
    name: Tests + app (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # The session test needs Screen Recording and Accessibility, which macOS
      # runners may refuse (TCC): it is then skipped and says so in the log.
      - name: End-to-end tests (sources)
        run: npm run test:e2e
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-macos
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the universal app (Intel + Apple silicon, ad-hoc signed dmg and zip)
        run: npm run dist:mac
        env:
          # Ad-hoc signing involves no secret: also for pull requests.
          CSC_FOR_PULL_REQUEST: "true"
      - name: Check the app bundle
        run: |
          app=dist/mac-universal/PairDesk.app
          archs=$(lipo -archs "$app/Contents/MacOS/PairDesk")
          echo "architectures: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@koromix"
          lipo -archs "$app/Contents/Resources/app.asar.unpacked/node_modules/@koromix/koffi-darwin-x64/darwin_x64/koffi.node"
          lipo -archs "$app/Contents/Resources/app.asar.unpacked/node_modules/@koromix/koffi-darwin-arm64/darwin_arm64/koffi.node"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep 'Signature=adhoc'
          plist="$app/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = pairdesk ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = false ]
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist"
          test -f "$app/Contents/Resources/icon.icns"
      - name: Install from the dmg, then smoke-test the installed app
        run: |
          dmg=$(ls dist/PairDesk-*-mac.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          ls -la "$RUNNER_TEMP/dmg"
          test -L "$RUNNER_TEMP/dmg/Applications"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$RUNNER_TEMP/dmg/PairDesk.app" "$RUNNER_TEMP/Applications/PairDesk.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          PAIRDESK_PACKAGED_EXE="$RUNNER_TEMP/Applications/PairDesk.app/Contents/MacOS/PairDesk" node --test test/e2e/smoke.test.js
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-packaged
      # Informative: Electron under Rosetta can hang on the runner's GPU-less VM.
      - name: Smoke test of the Intel half (Rosetta)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::Rosetta is not available on this runner: Intel half not tested"
            exit 0
          fi
          wrapper="$RUNNER_TEMP/pairdesk-x64.sh"
          printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$RUNNER_TEMP/Applications/PairDesk.app/Contents/MacOS/PairDesk" > "$wrapper"
          chmod +x "$wrapper"
          PAIRDESK_PACKAGED_EXE="$wrapper" node --test test/e2e/smoke.test.js
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-packaged-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-macos-packaged
          path: ${{ runner.temp }}/e2e-packaged*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: PairDesk-mac
          path: |
            dist/PairDesk-*-mac.dmg
            dist/PairDesk-*-mac.zip
            dist/latest-mac.yml
          retention-days: 90

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android SDK is preinstalled on the runner (ANDROID_HOME): only
      # the platform and build tools of the app are added.
      - name: Android SDK
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The interop tests of android/core run the desktop signaling code
      # (scripts/android-interop-peer.mjs): its npm dependencies, without the
      # Electron download of the postinstall script.
      - name: Desktop dependencies for the interop tests
        run: npm ci --ignore-scripts
      # Repository secrets (see README): the key that signs the released
      # APKs. Pushes only; pull requests get a debug-signed APK.
      - name: Open the signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/android-signing.sh
      - name: Tests and release APK
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testStandardDebugUnitTest :app:assembleRelease
      - name: Check the signatures, name the APKs PairDesk.apk and PairDesk-full.apk
        run: bash .github/scripts/android-apk.sh "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PairDesk-android
          path: |
            ${{ runner.temp }}/apk/PairDesk.apk
            ${{ runner.temp }}/apk/PairDesk-full.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pairdesk.keystore"

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pairdesk-server server
      - name: Run it and check the health endpoint
        run: |
          docker run -d --name pd -p 8080:8080 pairdesk-server
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs pd
          exit 1
