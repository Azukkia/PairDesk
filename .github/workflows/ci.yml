name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install X11 test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6
      - name: End-to-end test (two app instances under Xvfb, PairDesk server)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
      - name: End-to-end test (default mode, MQTT relays)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
        env:
          PAIRDESK_E2E_TRANSPORT: mqtt
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-mqtt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-linux
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Tests + installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the "PairDesk Camera" webcam (DirectShow filter)
        run: npm run build:camera
      - name: End-to-end test (real Windows desktop, SendInput)
        run: npm run test:e2e
        env:
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}\e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: ${{ runner.temp }}\e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the Windows installer
        run: npx electron-builder --win --x64 --publish never
      - name: End-to-end test of the packaged application
        run: npm run test:e2e
        env:
          PAIRDESK_PACKAGED_EXE: dist/win-unpacked/PairDesk.exe
          PAIRDESK_E2E_ARTIFACTS: ${{ runner.temp }}\e2e-packaged
      - name: Install with the setup program, test the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PairDesk-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PairDesk'
          $exe = Join-Path $dir 'PairDesk.exe'
          if (-not (Test-Path $exe)) { throw "PairDesk.exe was not installed in $dir" }
          Get-ChildItem $dir | Format-Table Name, Length
          $env:PAIRDESK_PACKAGED_EXE = $exe
          $env:PAIRDESK_E2E_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'e2e-installed'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $camera = 'HKCU:\Software\Classes\CLSID\{DC55A64C-A76A-40C0-8494-4D5E79100E45}'
          if (-not (Test-Path $camera)) { throw 'the camera session did not register PairDesk Camera' }
          Start-Process -FilePath (Join-Path $dir 'Uninstall PairDesk.exe') -ArgumentList '/S' -Wait
          # The uninstaller finishes from a copy of itself: wait for it.
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $camera)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $camera) { throw 'PairDesk Camera is still registered after uninstalling' }
      - uses: actions/upload-artifact@v4
        with:
          name: PairDesk-Setup-windows
          path: |
            dist/PairDesk-Setup-*.exe
            dist/latest.yml
          retention-days: 90

  android-signing:
    name: Android signing key
    # Repository secrets (see README): the key that signs the released APKs.
    # Only its public certificate fingerprint is printed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the key with the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No Android signing key in the repository secrets: released APKs get a throwaway key."
            exit 0
          fi
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret ANDROID_$v is missing"; exit 1; fi
          done
          ks="$RUNNER_TEMP/pairdesk.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          info=$(keytool -list -v -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")
          # In a PKCS12 keystore the key opens with the keystore password:
          # the Android build needs both secrets to be the same.
          type=$(keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" | grep -i 'Keystore type')
          if echo "$type" | grep -qi 'PKCS12' && [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD must be the same as ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          # The key itself must open with its password (not only the keystore).
          keytool -importkeystore -srckeystore "$ks" -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/check.p12" -deststoretype PKCS12 -deststorepass checkcheck -noprompt > /dev/null
          rm -f "$RUNNER_TEMP/check.p12"
          echo "$info" | grep -E 'SHA256:'
          echo "Android signing key OK"

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t pairdesk-server server
      - name: Run it and check the health endpoint
        run: |
          docker run -d --name pd -p 8080:8080 pairdesk-server
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs pd
          exit 1
