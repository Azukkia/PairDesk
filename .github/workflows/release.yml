# Publishes a GitHub release when the version in package.json changes on
# main. Installed copies of PairDesk detect the new release and offer to
# update themselves.
#
# To ship an update: bump "version" in package.json (e.g. 1.0.1), then merge
# into main (or run this workflow manually from the Actions tab).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      create: ${{ steps.version.outputs.create }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists: nothing to do."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the draft release
        if: steps.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "PairDesk ${{ steps.version.outputs.version }}" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.create == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload to the draft release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload into the draft created above; it is published at the end.
          EP_DRAFT: "true"

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (makes it visible to the auto-updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
