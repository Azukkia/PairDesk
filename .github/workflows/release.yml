# Publishes a GitHub release when the version in package.json changes on
# main. Installed copies of PairDesk detect the new release and offer to
# update themselves.
#
# To ship an update: bump "version" in package.json (e.g. 1.0.1), then merge
# into main (or run this workflow manually from the Actions tab).
#
# Release files never expire. Fixed-name copies give permanent links to the
# latest version, e.g.
#   https://github.com/Azukkia/PairDesk/releases/latest/download/PairDesk-Setup.exe
#   https://github.com/Azukkia/PairDesk/releases/latest/download/PairDesk-mac.dmg
#   https://github.com/Azukkia/PairDesk/releases/latest/download/PairDesk.apk
#   https://github.com/Azukkia/PairDesk/releases/latest/download/PairDesk-full.apk
# (the Android app, signed with the key of the ANDROID_* repository secrets;
# the desktop app's home screen offers it through a QR code).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      create: ${{ steps.version.outputs.create }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "Draft release v$version found (previous run did not finish): completing it."
              echo "create=true" >> "$GITHUB_OUTPUT"
              echo "draft_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$version already published: nothing to do."
              echo "create=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the draft release
        if: steps.version.outputs.create == 'true' && steps.version.outputs.draft_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "PairDesk ${{ steps.version.outputs.version }}" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.create == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux
          # Universal app (Intel + Apple silicon), ad-hoc signed, not notarized.
          # New: while it settles, a failure there does not hold back the
          # Windows and Linux release.
          - name: macOS
            os: macos-latest
            args: --mac --universal
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the "PairDesk Camera" webcam (Windows)
        if: runner.os == 'Windows'
        run: npm run build:camera
      - name: Build the screen capture without cursor (Windows)
        if: runner.os == 'Windows'
        run: npm run build:capture
      - name: Add koffi's binaries for both Mac architectures
        if: runner.os == 'macOS'
        run: node scripts/koffi-mac.mjs
      - name: Build and upload to the draft release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload into the draft created above; it is published at the end.
          EP_DRAFT: "true"
      - name: Add fixed-name copies (permanent "latest version" download links)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "dist/PairDesk-Setup-$VERSION.exe" dist/PairDesk-Setup.exe
            gh release upload "v$VERSION" dist/PairDesk-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp "dist/PairDesk-$VERSION-mac.dmg" dist/PairDesk-mac.dmg
            gh release upload "v$VERSION" dist/PairDesk-mac.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            cp "dist/PairDesk-$VERSION-x86_64.AppImage" dist/PairDesk-x86_64.AppImage
            cp "dist/PairDesk-$VERSION-amd64.deb" dist/PairDesk-amd64.deb
            gh release upload "v$VERSION" dist/PairDesk-x86_64.AppImage dist/PairDesk-amd64.deb --clobber --repo "$GITHUB_REPOSITORY"
          fi

  android:
    name: Build (Android)
    needs: prepare
    if: needs.prepare.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android SDK is preinstalled on the runner (ANDROID_HOME): only
      # the platform and build tools of the app are added.
      - name: Android SDK
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # For the interop tests of android/core (desktop signaling code), without Electron.
      - name: Desktop dependencies for the interop tests
        run: npm ci --ignore-scripts
      # Released APKs are always signed with the PairDesk key (updates install
      # over the previous version only with the same key).
      - name: Open the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/android-signing.sh --required
      - name: Tests and release APK
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testStandardDebugUnitTest :app:assembleRelease
      - name: Check the signature
        run: bash .github/scripts/android-apk.sh "$RUNNER_TEMP/apk" --expect-release-key
      - name: Upload to the draft release (versioned and fixed-name copies)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/apk/PairDesk.apk" "$RUNNER_TEMP/apk/PairDesk-$VERSION.apk"
          cp "$RUNNER_TEMP/apk/PairDesk-full.apk" "$RUNNER_TEMP/apk/PairDesk-full-$VERSION.apk"
          gh release upload "v$VERSION" "$RUNNER_TEMP/apk/PairDesk-$VERSION.apk" "$RUNNER_TEMP/apk/PairDesk.apk" \
            "$RUNNER_TEMP/apk/PairDesk-full-$VERSION.apk" "$RUNNER_TEMP/apk/PairDesk-full.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pairdesk.keystore"

  publish:
    name: Publish release
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (makes it visible to the auto-updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
